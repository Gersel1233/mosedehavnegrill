<!-- Fanens ikon er LOGOET — kransens eget mærke: isen og de to
     bægre, i logoets røde #d62a3a på hvid. Geometrien er kransens
     fra introen (samme cirkler, samme kegle, samme bægre), kun
     stregerne er tykkere: kransens 4,6 px i et 300-net er en
     kvart pixel på en browserfane, og så er mærket væk.

     ⚠️ HER STOD EN BÅD I DE GAMLE FARVER (marineblaa og den gamle roede) til
     29/8 — det gamle mærke, før kransen. Kransen kom på alle
     sider, men fanens ikon blev glemt TO gange. Ret den aldrig
     tilbage, og brug aldrig sidens --red her: et logo skifter
     ikke farve med et tema. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <circle cx="150" cy="150" r="140" fill="#fff" stroke="#d62a3a" stroke-width="16"/>
  <g transform="translate(150 150) scale(1.18) translate(-150 -143)"
     fill="#fff" stroke="#d62a3a" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="150" cy="96" r="19"/>
    <circle cx="133" cy="124" r="19"/>
    <circle cx="167" cy="124" r="19"/>
    <path d="M124 139h52l-26 66z"/>
    <path d="M56 152h32l-5 40H61z"/>
    <path d="M212 152h32l-5 40h-22z"/>
  </g>
  <g transform="translate(150 150) scale(1.18) translate(-150 -143)"
     fill="none" stroke="#d62a3a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M131 155h38M138 172h24M144 188h12"/>
    <path d="M63 152v-26M72 152v-32M81 152v-26"/>
    <path d="M219 152v-26M228 152v-32M237 152v-26"/>
  </g>
</svg>
