     DEN HER SIDE ER FLYTTET  (30/8-2026)
     ------------------------------------------------------------
     Der stod TO udgaver af hjemmesiden i luften på én gang. Da
     designet fra Claude Design kom 23/8, blev der bygget nye
     sider ved siden af de gamle — og de gamle blev aldrig taget
     ned. MÅLT 30/8: af de ni gamle sider kunne kun bord/ nås fra
     den nye side. De otte andre var forældreløse, havde ingen
     noindex og pegede canonical på sig selv.

     Det betød, at en gæst, der googlede "smørrebrød Mosede Havn",
     kunne lande i den GAMLE verden — hvor hvert eneste link førte
     dybere ind i den, og hvor hun aldrig så den nye side.

     ⚠️ SIDEN SLETTES IKKE, DEN OMDIRIGERER. Adressen står i
     Googles resultater og i folks bogmærker. En 404 er et blindt
     spor; en omdirigering lander dem det rigtige sted.

     ⚠️ TRE LAG, FORDI GITHUB PAGES IKKE HAR EN SERVER.
       canonical  → fortæller Google, at den nye er den rigtige
       refresh    → flytter browseren, også uden JavaScript
       script     → flytter den med det samme og lader være med at
                    lægge den her side i historikken, så
