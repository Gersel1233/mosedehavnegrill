<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Mosede Havnegrill og Ishus – Scoop Film</title>

<!-- ==========================================================
     KILDEFILEN TIL ISFILMEN

     Denne fil er IKKE en del af hjemmesiden. Gæsterne ser en
     færdig video (billeder/isfilm.mp4). Filen her er opskriften
     bag den: den tegner ét billede ad gangen, så filmen kan
     laves om igen hvis en kugle eller en tekst skal rettes.

     Kør den om med:  node vaerktoej/lav-isfilm.js

     TRE VALG DER BETYDER NOGET

     1) Ingen React, ingen Babel, intet fra nettet.
        Prototypen hentede React, Babel og Google Fonts fra
        fremmede servere. Det ville betyde at filmen kun kunne
        laves om så længe de servere findes, og at to kørsler
        kunne give to forskellige resultater. Her er alt lokalt,
        og matematikken er kopieret ord for ord fra prototypen.

     2) Alt er en funktion af ét tal: T (sekunder).
        Ingen tilstand, ingen ophobning fra billede til billede.
        Billede nummer 200 ser ens ud uanset om man har tegnet de
        199 første. Det er hele grunden til at en optagelse
        billede-for-billede overhovedet kan blive glat.

     3) ?t=5.4 tegner ét bestemt øjeblik og siger til når
        skrifter og billeder er på plads. Uden ?t kører den som
        en løkke, så man selv kan se den i en browser.
     ========================================================== -->

<style>
  :root {
    --sand: #f7f0e4;
    --sea:  #0f2c44;
    --red:  #d1462f;
  }

  /* Skrifterne ligger i mappen ved siden af. font-display: block
     – vi vil hellere vente end optage et billede hvor teksten
     står i en tilfældig systemskrift. */
  @font-face {
    font-family: "Bebas Neue";
    src: url("../fonts/bebas-neue.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "Instrument Sans";
    src: url("../fonts/instrument-sans.woff2") format("woff2");
    font-weight: 400 700;
    font-display: block;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; }

  /* Scenens størrelse sættes af JavaScript, for der er TO
     formater: 1920 × 1080 til computeren og 1080 × 1350 til
     telefonen. Se FORMATER nede i scriptet. Optagelsen sker i
     netop den størrelse; ser man filen i en browser, skaleres den
     ned med en transform. */
  #scene {
    position: relative;
    overflow: hidden;
    background: var(--sand);
    transform-origin: 0 0;
  }

  #scene img { display: block; }

  .lag { position: absolute; inset: 0; }
</style>
</head>
<body>

<div id="scene">
  <!-- Sandbaggrunden. Toner ud når havnen kommer frem. -->
  <div class="lag" id="sand"></div>

  <!-- Havnen. Ligger under alt andet og tones frem med fokus. -->
  <img class="lag" id="havn" src="harbour.jpg" alt="">

  <!-- Mørkt slør, kun i den side hvor titlen står. Uden det
       ville hvid skrift stå på en solnedgang, og solnedgange er
       lyse lige der hvor de er smukkest. -->
  <div class="lag" id="scrim"></div>

  <!-- Kameraet. Alt indeni bliver flyttet og zoomet i ét. -->
  <div class="lag" id="kamera">
    <!-- Stakken: hånd, kegle og kugler vipper som én ting. -->
    <div class="lag" id="stak">
      <img id="choc"  src="scoop-choc.png" alt="">
      <img id="haand" src="cone-hand.png"  alt="">
      <img id="top"   src="scoop-top.png"  alt="">
      <img id="left"  src="scoop-left.png" alt="">
    </div>
  </div>

  <!-- Titelblokken. Linjerne kører op bag en maske. -->
  <div id="titel">
    <div id="streg"></div>
    <div id="ord">
      <div class="maske"><div class="linje" id="l0">MOSEDE</div></div>
      <div class="maske"><div class="linje" id="l1">HAVNEGRILL</div></div>
      <div class="maske"><div class="linje" id="l2">&amp; ISHUS</div></div>
    </div>
    <div id="under">Udsigten er inkluderet</div>
  </div>

  <!-- Undertekst midt i filmen. -->
  <div id="tekst"></div>

  <!-- Udtoning til sand, så filmen kan gå i ring. -->
  <div class="lag" id="fade"></div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Scenerne, som prototypen skrev dem ----------
     Rækkefølgen er tidslinjen. CUES er den løbende sum, altså
     hvornår hvert afsnit begynder. */
  var SCENER = [
    ['Open',       1.6],
    ['ScoopOne',   1.2],
    ['ScoopTwo',   1.1],
    ['ScoopThree', 1.2],
    ['Hold',       1.6],
    ['Udsigt',     4.4],
    ['Out',        1.0]
  ];

  var CUES = {}, IALT = 0;
  SCENER.forEach(function (s) {
    CUES[s[0]] = Math.round(IALT * 1000) / 1000;
    IALT = Math.round((IALT + s[1]) * 1000) / 1000;
  });
  // IALT = 12,1 sekunder

  var S1 = CUES.ScoopOne, S2 = CUES.ScoopTwo, S3 = CUES.ScoopThree,
      H  = CUES.Hold,     U  = CUES.Udsigt;

  /* ---------- Lempninger, kopieret fra biblioteket ---------- */
  var Easing = {
    easeOutQuad:    function (t) { return t * (2 - t); },
    easeOutCubic:   function (t) { return (--t) * t * t + 1; },
    easeInOutCubic: function (t) {
      return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1;
    },
    easeOutQuart:   function (t) { return 1 - (--t) * t * t * t; },
    easeOutExpo:    function (t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); },
    easeInOutSine:  function (t) { return -(Math.cos(Math.PI * t) - 1) / 2; }
  };

  /* ==========================================================
     TO FORMATER
     ----------------------------------------------------------
     Filmen fandtes kun i 1920 × 1080. På en computer er den fin.
     På en telefon er afsnittet 350 px bredt, og en 16:9-ramme er
     så 197 px høj: navnet i 96 px bliver 17 px på skærmen,
     underlinjen i 25 px bliver 4,5, og åbningslinjen kan slet
     ikke læses. Filmen var ikke for lille – den var i det forkerte
     format.

     Højformatet er 1080 × 1350 (4:5). Det er ikke det samme
     billede beskåret: keglen er 35% større i forhold til rammen,
     kameraet ender OPPE i stedet for til siden, og titlen står
     under keglen i stedet for ved siden af.

     Alt der er forskelligt mellem de to, står her. Selve
     bevægelsen – hop, dask, kameraryk, overgang – er den samme
     kode, og der er derfor kun ét sted at rette en timing.
     ========================================================== */
  var FORMATER = {
    bred: {
      W: 1920, H: 1080,
      /* K, OX og OY er den ramme designeren tegnede kuglerne i.
         De skal stå præcis som de gør i det brede format: rører man
         ved dem, lander kuglerne ved siden af keglen. */
      K: 0.78, OX: 564, OY: 6,
      origin: '50% 58%',
      // Kameraet ender NEDE TIL VENSTRE, så titlen får højre side
      camS: [[0, 1.40], [1.5, 1.28], [S3 + 0.2, 1.34], [H + 1.5, 1.05], [U + 2.0, 0.66]],
      camY: [[0, 150], [1.5, 70], [S3 + 0.2, 95], [H + 1.5, 40], [U + 2.0, 196]],
      camX: [[0, 0], [U, 0], [U + 2.0, -330]],
      // Mørkest i højre side, hvor skriften står
      scrim: 'linear-gradient(90deg, rgba(10,20,38,.06) 0%, rgba(10,20,38,.19) 30%,'
           + ' rgba(10,20,38,.42) 58%, rgba(10,20,38,.60) 100%)',
      titel: 'left:1070px;top:352px;width:700px;',
      ordSize: 96, underSize: 25, stregBred: 132,
      tekst: 'left:1300px;top:130px;width:470px;font-size:34px;'
    },
    hoej: {
      W: 1080, H: 1350,
      /* Samme kugler, 35% større i forhold til rammen. OX er
         regnet så samlingen står midt i de 1080: kuglerne fylder
         designerkoordinat 139 til 776, altså midte 457,5, og
         540 − 457,5 × 1,05 = 60. OY er negativ, fordi den øverste
         kugle ellers ville ligge for lavt i den høje ramme. */
      K: 1.05, OX: 60, OY: -66,
      /* Drejepunktet ligger HØJT (34% mod 58%). Zoomer man ud om et
         punkt, trækker alt sig sammen mod det – ligger punktet
         lavt, glider keglen NED i billedet når kameraet trækker
         sig tilbage, og så er der ingen plads til titlen. */
      origin: '50% 34%',
      // Kameraet ender OPPE OG TIL HØJRE, så titlen får den nederste tredjedel
      camS: [[0, 1.16], [1.5, 1.04], [S3 + 0.2, 1.10], [H + 1.5, 0.92], [U + 2.0, 0.60]],
      camY: [[0, 120], [1.5, 40], [S3 + 0.2, 60], [H + 1.5, 10], [U + 2.0, -40]],
      /* Keglen skubbes TIL HØJRE til sidst, ikke bare op. Ærmet er
         320 px bredt i den færdige ramme, og med camX 60 løb det
         ned gennem midten – lige hen over det sted hvor
         "HAVNEGRILL" slutter. Hvid Bebas på en mørkerød ærme måler
         1,16:1. Ved 200 er venstre halvdel fri til titlen, og isen
         står i det øverste højre hjørne med solnedgangen ved siden
         af. */
      camX: [[0, 0], [U, 0], [U + 2.0, 200]],
      // Mørkest NEDE, hvor skriften står
      scrim: 'linear-gradient(180deg, rgba(10,20,38,.04) 0%, rgba(10,20,38,.14) 34%,'
           + ' rgba(10,20,38,.52) 72%, rgba(10,20,38,.80) 100%)',
      titel: 'left:96px;top:930px;width:900px;',
      ordSize: 104, underSize: 30, stregBred: 150,
      tekst: 'left:96px;top:96px;width:640px;font-size:44px;'
    }
  };

  var PARAM = new URLSearchParams(location.search);
  var FORM = FORMATER[PARAM.get('form') === 'hoej' ? 'hoej' : 'bred'];

  var K = FORM.K, OX = FORM.OX, OY = FORM.OY;
  function px2(v) { return OX + v * K; }
  function py2(v) { return OY + v * K; }
  function sw(w)  { return w * K; }

  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  var MOTION = {
    hopUp: function (p) { return 1 - Math.pow(1 - p, 3); },  // op i luften
    drop:  function (p) { return p * p; },                   // ned i keglen
    glide: Easing.easeInOutCubic                             // kameraet
  };

  /* Nøglebilleder: en liste af [tid, værdi]. Mellem to punkter
     lempes der, uden for enderne holdes værdien. */
  function kf(T, ks, ease) {
    if (T <= ks[0][0]) return ks[0][1];
    for (var i = 0; i < ks.length - 1; i++) {
      var t0 = ks[i][0], v0 = ks[i][1], t1 = ks[i + 1][0], v1 = ks[i + 1][1];
      if (T < t1) return v0 + (v1 - v0) * ease(clamp01((T - t0) / (t1 - t0)));
    }
    return ks[ks.length - 1][1];
  }

  var LAND = function (at) { return at + 0.62; };

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    sand: $('sand'), havn: $('havn'), scrim: $('scrim'),
    kamera: $('kamera'), stak: $('stak'),
    choc: $('choc'), haand: $('haand'), top: $('top'), left: $('left'),
    titel: $('titel'), streg: $('streg'), under: $('under'),
    linjer: [$('l0'), $('l1'), $('l2')],
    tekst: $('tekst'), fade: $('fade')
  };

  /* ---------- Det der ikke ændrer sig ---------- */
  var scene = document.getElementById('scene');
  scene.style.width = FORM.W + 'px';
  scene.style.height = FORM.H + 'px';

  el.sand.style.background =
    'radial-gradient(115% 85% at 50% 16%, #fffbf3 0%, #f3e9d9 58%, #e6d9c3 100%)';

  /* Havnefotoet står midt i billedet og kan skaleres op uden at
     flytte sig. Bemærk rækkefølgen: inset skal nulstilles FØR
     left og top sættes. inset er en genvej for alle fire sider,
     så kommer den bagefter, sletter den dem igen – og så lander
     billedet i øverste venstre hjørne i stedet for at dække. */
  el.havn.style.cssText +=
    'inset:auto;left:50%;top:50%;width:' + FORM.W + 'px;height:' + FORM.H
    + 'px;object-fit:cover;';

  /* Sløret over havnen.

     ANDEN AFVIGELSE, OG DEN ER NØDVENDIG: prototypen lagde det
     mørkeste af sløret i VENSTRE side og lod højre side være
     næsten klar. Men titlen står i højre side, og på det her
     foto er højre side solnedgangens lyseste hjørne – himmel og
     master i orange. Hvid skrift dér kan ikke læses.

     Sløret er derfor vendt om: mørkest i højre side hvor skriften
     står, klar i venstre side hvor keglen står. Så beholder isen
     sit lys, og navnet bliver læseligt.

     Hvor mørkt det skal være, er ikke gættet – det er målt på de
     færdige billeder i tests/isfilm.spec.js. Tallene er lettet
     fra .08/.24/.52/.72 da udsigten blev skiftet til det nye foto
     af terrassen: dér er højre side mørkere af sig selv – både
     parasollen og bådene – og navnet lå på 5,6:1 mod et krav på
     3,0. Det er margin man kan give tilbage til billedet i stedet
     for at lade den stå ubrugt.

     I HØJFORMATET står titlen NEDERST og ikke til højre, så sløret
     er vendt en kvart omgang: mørkest i bunden. Bordet og
     trædækket fylder den nederste tredjedel af fotoet og er lyst
     træ i solnedgang, så der skal mere til end i det brede
     format. */
  el.scrim.style.background = FORM.scrim;

  el.kamera.style.transformOrigin = FORM.origin;
  el.stak.style.transformOrigin = '50% 100%';

  el.fade.style.background = 'var(--sand)';
  el.fade.style.pointerEvents = 'none';

  // Titelblokken: samme skrift som prototypen, plads fra formatet
  el.titel.style.cssText =
    'position:absolute;color:#fff7ea;' + FORM.titel;
  el.streg.style.cssText =
    'height:3px;background:#fff7ea;opacity:.85;margin-bottom:34px;border-radius:2px;';
  $('ord').style.cssText =
    'font-family:"Bebas Neue",sans-serif;font-size:' + FORM.ordSize + 'px;line-height:.96;' +
    'letter-spacing:.05em;text-shadow:0 6px 34px rgba(8,16,30,.55);';
  Array.prototype.forEach.call(document.querySelectorAll('.maske'), function (m) {
    m.style.cssText = 'overflow:hidden;padding-bottom:2px;';
  });
  el.under.style.cssText =
    'margin-top:30px;font-family:"Instrument Sans",system-ui,sans-serif;' +
    'font-size:' + FORM.underSize + 'px;text-transform:uppercase;' +
    'text-shadow:0 4px 24px rgba(8,16,30,.6);';

  /* ÅBNINGSLINJEN. Tre ting er anderledes end i prototypen:

     TIDEN. Prototypen satte den ind midt i filmen, mens havnen
     tonede frem. Det kan ikke gå: dér er baggrunden hverken lys
     eller mørk, men en solnedgang under en dis, og ingen tekstfarve
     kan læses på begge. Den står nu i de første sekunder, hvor
     baggrunden er rent sand.

     Det er også en bedre film. Linjen lover en udsigt FØR man har
     set den, overgangen får de fire sekunder for sig selv, og
     navnet lander til sidst. Løfte, indfrielse, underskrift.

     PLADSEN. Prototypen satte den midt for, nederst. Dér står
     hånden med keglen, så teksten landede oven på en mørkerød
     ærme: målt til 1,16:1, altså usynlig. Den står nu øverst til
     højre, hvor der er tomt sand. Med det tættere kamera rager
     chokoladekuglen ud til x≈1285 midt i sit hop, så teksten
     begynder i 1300 – de kan ikke støde sammen.

     FARVEN. Prototypen skrev den i cremehvid (#f6f4ef), som ikke
     kan læses på sand. Den er blækblå, husets mørke farve.
     Skriften er husets egen; prototypen bad om Inter uden at have
     den med. */
  el.tekst.style.cssText =
    'position:absolute;font-weight:500;' +
    'font-family:"Instrument Sans",system-ui,sans-serif;color:var(--sea);' +
    'line-height:1.35;pointer-events:none;' + FORM.tekst;

  var UNDERTEKST = { at: 0.7, until: 2.9, tekst: 'Tre kugler. Én hånd. Én udsigt.' };
  var TEKST_FADE = 0.18;
  el.tekst.textContent = UNDERTEKST.tekst;

  /* ---------- En kugle ----------
     Den hopper op fra neden, skyder lidt over målet og falder
     ned i keglen. Bagefter dasker den et par gange – hurtigt
     aftagende, så det ligner is og ikke gummi. */
  function kugle(node, T, o) {
    var at = o.at, land = LAND(at);
    var p = clamp01((T - at) / (land - at));

    /* Afstandene ganges med K, ligesom kuglerne selv. Prototypens
       tal var 760, −105 og 160 ved K = 0,78; skrevet som 975·K,
       −134,6·K og 205·K giver de præcis det samme i det brede
       format, men følger med når højformatet gør keglen 35% større.
       Ellers ville kuglerne hoppe kortere i forhold til isen, og
       hoppet er det filmen handler om. */
    var HOP = 975 * K, OVER = -134.6 * K, SIDE = 205 * K;

    var dy;
    if (p < 0.72) dy = HOP + (OVER - HOP) * MOTION.hopUp(p / 0.72);
    else          dy = OVER - OVER * MOTION.drop((p - 0.72) / 0.28);

    var dx  = o.dir * SIDE * (1 - MOTION.hopUp(p));
    var rot = o.dir * 16   * (1 - MOTION.hopUp(p));
    var vel = Math.abs(dy) > 2 ? Math.min(18, Math.abs(dy) * 0.035) : 0;

    var q    = clamp01((T - land) / 1.05);
    var bump = T < land ? 0 : Math.exp(-4.6 * q) * Math.sin(6.4 * q);
    var grow = 1.08;
    var sX = (1 + 0.14 * bump) * grow, sY = (1 - 0.17 * bump) * grow;

    node.style.cssText =
      'position:absolute;left:' + px2(o.ox) + 'px;top:' + py2(o.oy) + 'px;' +
      'width:' + sw(o.size) + 'px;z-index:' + o.z + ';' +
      'opacity:' + (T < at ? 0 : 1) + ';' +
      'transform:translate(' + dx + 'px,' + dy + 'px) rotate(' + rot + 'deg)' +
      ' scale(' + sX + ',' + sY + ');transform-origin:50% 86%;' +
      'filter:blur(' + (vel * 0.15) + 'px) drop-shadow(0 ' + (14 + vel) + 'px ' +
      (20 + vel) + 'px rgba(15,44,68,.20));';
    return bump;
  }

  /* HVOR KUGLERNE LANDER

     Tallene er flyttet fra prototypens. Dens tre kugler stod med
     luft imellem: den lyse hang frit oppe til venstre, og ingen af
     dem rørte isen der allerede sidder i keglen. Det så ud som tre
     billeder lagt oven på hinanden, ikke som en is.

     De står nu som en rigtig trekugleis. Isen i keglen har sin
     top i y≈569 og midte i (918, 678) – målt på et billede fra
     filmen – og de tre kugler er sat så de skærer 60-80 pixel ned
     i den. Så er der ingen luft nogen steder.

       nederst venstre  midte (812, 486)   foran keglen
       nederst højre    midte (1032, 480)  bag keglen
       øverst           midte (920, 330)   i kløften mellem dem

     Afstanden mellem naboer er 187-220 px mod en radius på 150-172.
     Det er tæt nok til at de rører, og løst nok til at man kan se
     at der er tre.

     Den øverste kugles top ligger i y=143. Lavere kunne den ikke
     komme: ved det tætteste kamera – zoom 1,082 plus rykket når
     den lander – ville den blive klippet af oven til.

     ox og oy er designerens egne koordinater, ikke pixels: de
     ganges med 0,78 og forskydes med (564, 6). Der er også regnet
     for grow 1,08, som skalerer om (50%, 86%) og altså flytter
     kassen en smule op og til venstre. */
  var KUGLER = [
    [el.choc, { size: 352, ox: 424, oy: 433, at: S1, dir: 1,    z: 2 }],
    [el.top,  { size: 408, ox: 252, oy: 206, at: S3, dir: 0.35, z: 4 }],
    [el.left, { size: 358, ox: 139, oy: 432, at: S2, dir: -1,   z: 5 }]
  ];

  /* ---------- Ét billede ---------- */
  function tegn(T) {
    if (T > IALT) T = IALT;   // som biblioteket: tiden klipper ved slutningen

    // Kameraet: et lille ryk ved hver landing, derefter ud og til siden
    function punch(t)  { var d = T - LAND(t); return d < 0 ? 0 :  0.022 * Math.exp(-3.2 * d) * Math.cos(2.6 * d); }
    function punchY(t) { var d = T - LAND(t); return d < 0 ? 0 :    -8 * Math.exp(-3.4 * d) * Math.cos(2.8 * d); }
    function jelly(t)  { var d = T - LAND(t); return d < 0 ? 0 :         Math.exp(-4.2 * d) * Math.sin(6.2 * d); }

    var stackWob = jelly(S1) + jelly(S2) + jelly(S3);

    /* KAMERAET ER RYKKET TÆTTERE PÅ END I PROTOTYPEN

       Prototypen holdt zoom omkring 1,0 gennem hele opbygningen.
       Motivet er en kegle i en hånd: 522 px bred og 1006 px høj.
       I et billede på 1920×1080 fylder det så en fjerdedel af
       bredden, og resten er tomt sand. På en computer er det
       luftigt. På en telefon, hvor filmen er 350 px bred, er det
       en næsten tom kasse med en lille klat i.

       Zoom 1,28-1,40 i opbygningen gør keglen en tredjedel større
       og skærer det tomme sand væk. camY følger med: uden den
       ville den øverste kugle blive klippet af oven til, for
       kameraet drejer om 58% af højden.

       Loftet er sat af den øverste kugles top i y=143. Ved det
       tætteste – zoom 1,34 plus rykket når kuglen lander – er der
       41 px luft tilbage. Mere zoom, og kuglen ryger ud af
       billedet.

       Teksterne ligger UDEN FOR kameraet og bliver ikke rørt. */
    var camS = kf(T, FORM.camS, MOTION.glide)
             + punch(S1) + punch(S2) + punch(S3);
    var camY = kf(T, FORM.camY, MOTION.glide)
             + punchY(S1) + punchY(S2) + punchY(S3);
    var camX = kf(T, FORM.camX, MOTION.glide);

    /* ---------- DEN SVÆVER ----------

       Stakken kom op fra neden i de første 1,35 sekund og stod så
       stille indtil Hold, hvor den begyndte at vippe. De fire
       sekunder imellem – hele opbygningen med de tre kugler – stod
       den bomstille mellem hoppene. Det var derfor den ikke
       "floatede": den lå ikke i luften, den var parkeret.

       Nu er der en vedvarende bevægelse hele filmen igennem: to
       sinusser med perioder der ikke går op i hinanden (5,5 og 10,3
       sekunder), så mønsteret ikke gentager sig inden for filmens
       12 sekunder og aldrig lyder som en metronom. Amplituden er 9
       og 5 px – nok til at man kan se den, for lidt til at man
       lægger mærke til den.

       Vippen begynder nu også fra første billede i stedet for ved
       Hold, men den TONES IND over det første sekund. Uden det
       ville den kæmpe med opstigningen, og keglen ville komme skævt
       op af sandet.

       Alt er skaleret med K, så svævet fylder det samme i forhold
       til keglen i begge formater. */
    var svaevInd = clamp01(T / 1.0);
    var svaev = (Math.sin(T * 1.15) * 9 + Math.sin(T * 0.61 + 1.1) * 5) * svaevInd * K;

    var rise = kf(T, [[0, 1000 * K], [1.35, 0]], Easing.easeOutCubic) - svaev;
    var sway = Math.sin(T * 1.25) * 0.9 * svaevInd;

    /* OVERGANGEN TIL UDSIGTEN

       Prototypen tonede havnen op til 0,55 og lod den blive der i
       to sekunder, mens sandet samtidig tonede ned. To halvt
       gennemsigtige lag oven på hinanden giver en mælket grød –
       hverken sand eller havn, bare lyst.

       Nu er havnen fuldt til stede allerede efter 0,8 sekund, og
       det er SANDET der letter. Så ser man en uskarp havn gennem
       en dis der trækker væk, og fokus falder på plads. Det er en
       overgang man kan se hvad der sker i. */
    var harbOp   = kf(T, [[H + 0.4, 0], [H + 1.2, 1]], Easing.easeInOutSine);
    var harbS    = kf(T, [[H + 0.4, 1.22], [U + 3.6, 1.0]], Easing.easeOutQuart);
    var harbBlur = kf(T, [[H + 0.4, 44], [U + 0.5, 30], [U + 2.1, 0]], Easing.easeOutCubic);
    var sandOp   = kf(T, [[H + 0.4, 1], [U + 1.4, 0]], Easing.easeInOutSine);
    var coneBlur = kf(T, [[U + 0.4, 0], [U + 1.2, 3.5], [U + 2.2, 0]], Easing.easeInOutSine);
    var scrim    = kf(T, [[U + 0.6, 0], [U + 1.9, 1]], Easing.easeInOutSine);
    var fade     = kf(T, [[IALT - 0.85, 0], [IALT - 0.05, 1]], Easing.easeInOutSine);

    el.sand.style.opacity = sandOp;

    el.havn.style.opacity = harbOp;
    el.havn.style.transform = 'translate(-50%,-50%) scale(' + harbS + ')';
    el.havn.style.filter = 'blur(' + harbBlur + 'px)';

    el.scrim.style.opacity = scrim;

    el.kamera.style.transform =
      'translate(' + camX + 'px,' + camY + 'px) scale(' + camS + ')';
    el.kamera.style.filter = 'blur(' + coneBlur + 'px)';

    el.stak.style.transform =
      'translateY(' + rise + 'px) rotate(' + (sway + stackWob * 0.7) + 'deg)' +
      ' scale(' + (1 + stackWob * 0.012) + ',' + (1 - stackWob * 0.016) + ')';

    KUGLER.forEach(function (par) { kugle(par[0], T, par[1]); });

    /* Hånden med keglen ligger fast i stakken.

       SKYGGEN FØLGER SVÆVET, OG DET ER DEN DER GØR ARBEJDET.
       En drop-shadow sidder på sit element og flytter sig med det –
       en skygge der svæver sammen med keglen fortæller ingenting.
       Derfor lægges svævet til skyddens afstand ét til ét: når
       stakken går 9 px op, går skyggen 9 px længere ned, og den
       bliver dermed STÅENDE på sandet mens keglen letter fra den.
       Det er hele forskellen mellem noget der flytter sig og noget
       der svæver.

       Sløringen vokser med afstanden, og skyggen bliver samtidig
       lysere: en skygge tæt på er hård og mørk, en langt væk er
       blød og bleg. */
    var skyggeAf = 30 * K + svaev;
    var skyggeBlur = 40 * K + Math.abs(svaev) * 1.6;
    var skyggeAlfa = Math.max(.08, .20 - svaev * 0.004);

    el.haand.style.cssText =
      'position:absolute;left:' + px2(130) + 'px;top:' + py2(666) + 'px;' +
      'width:' + sw(580) + 'px;z-index:3;' +
      'filter:drop-shadow(0 ' + skyggeAf + 'px ' + skyggeBlur + 'px '
      + 'rgba(15,44,68,' + skyggeAlfa.toFixed(3) + '));';

    // Titlen: hver linje kører op bag sin maske, en smule forskudt
    el.linjer.forEach(function (n, i) {
      var s = U + 1.5 + i * 0.18;
      n.style.transform = 'translateY(' + kf(T, [[s, 110], [s + 0.95, 0]], Easing.easeOutExpo) + '%)';
      n.style.opacity   = kf(T, [[s, 0], [s + 0.35, 1]], Easing.easeOutQuad);
      n.style.filter    = 'blur(' + kf(T, [[s, 7], [s + 0.7, 0]], Easing.easeOutCubic) + 'px)';
    });
    el.streg.style.width =
      kf(T, [[U + 1.35, 0], [U + 2.2, FORM.stregBred]], Easing.easeOutExpo) + 'px';
    el.under.style.opacity = kf(T, [[U + 2.2, 0], [U + 2.9, 1]], Easing.easeOutQuad);
    el.under.style.letterSpacing = kf(T, [[U + 2.2, 0.34], [U + 3.1, 0.18]], Easing.easeOutCubic) + 'em';

    // Underteksten toner ind og ud i hver ende
    var o = 0;
    if (T >= UNDERTEKST.at && T < UNDERTEKST.until) {
      o = Math.min(1, (T - UNDERTEKST.at) / TEKST_FADE);
      o = Math.min(o, (UNDERTEKST.until - T) / TEKST_FADE);
      o = clamp01(o);
    }
    el.tekst.style.opacity = o;

    el.fade.style.opacity = fade;
  }

  window.SCOOP = {
    tegn: tegn, ialt: IALT, cues: CUES,
    // Optageren skal vide hvor stort et vindue den skal bruge
    bredde: FORM.W, hoejde: FORM.H
  };

  /* ---------- Klar-besked ----------
     Optageren må ikke tage billedet før skrifter og billeder er
     hentet. Ellers kommer de første sekunder ud i en
     systemskrift, eller helt uden kugler. */
  function naarKlar(saa) {
    var billeder = Array.prototype.slice.call(document.images);
    Promise.all(billeder.map(function (b) {
      if (b.complete && b.naturalWidth) return Promise.resolve();
      return new Promise(function (ok) {
        b.addEventListener('load', ok, { once: true });
        b.addEventListener('error', ok, { once: true });
      });
    }))
      .then(function () { return document.fonts ? document.fonts.ready : null; })
      .then(function () { return new Promise(function (ok) { requestAnimationFrame(function () { requestAnimationFrame(ok); }); }); })
      .then(saa);
  }

  var etBillede = PARAM.get('t');

  if (etBillede !== null) {
    // Ét fastlagt øjeblik. window.KLAR er signalet til optageren.
    tegn(parseFloat(etBillede) || 0);
    naarKlar(function () {
      tegn(parseFloat(etBillede) || 0);   // igen, nu med rigtige skrifter
      window.KLAR = true;
    });
  } else {
    // Til at se på i en browser: skaler ned og kør i ring
    var tilpas = function () {
      var s = Math.min(window.innerWidth / FORM.W, window.innerHeight / FORM.H);
      el.sand.parentNode.style.transform = 'scale(' + s + ')';
      document.body.style.width = (FORM.W * s) + 'px';
      document.body.style.height = (FORM.H * s) + 'px';
    };
    tilpas();
    window.addEventListener('resize', tilpas);

    naarKlar(function () {
      var start = performance.now();
      (function ring(nu) {
        tegn(((nu - start) / 1000) % IALT);
        requestAnimationFrame(ring);
      })(start);
    });
  }
})();
</script>
</body>
</html>
