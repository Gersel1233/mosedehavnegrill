name: Udgiv til GitHub Pages

# HVOR GÅR DET HEN? Til Mosede Havnecafe' egen adresse:
# https://gersel1233.github.io/mosedehavnegrill/
#
# Det står her, fordi opskriften bag opsætningen er lånt fra et andet
# kundeprojekt, og lånt tekst har det med at følge med. Møder du en
# kommentar, en README-linje eller en fejlbesked et sted i det her
# repo, der siger, at en gren går live på spiis.dk: den er arvet, og
# den er forkert. spiis er en anden kunde, i et andet repo, med en
# anden database, og intet i dette workflow rører den.
#
# Sådan ser grenene ud i dag:
#   claude/lesreg-customer-setup-5atpuu   er repoets standardgren, og
#                                         DEN er i luften lige nu
#   main                                  findes ikke endnu. Navnet
#                                         står her, fordi det er den
#                                         aftalte udgivelsesgren den
#                                         dag, vi samler op
#
# Alle andre grene er arbejdsgrene. Et push dertil udgiver ingenting.

on:
  push:
    branches:
      - main                              # udgivelsesgrenen, når den kommer
      - claude/lesreg-customer-setup-5atpuu   # standardgrenen – den er live nu

  # HER STOD workflow_dispatch, og det var en bagdør ind på kundens
  # hjemmeside. Den satte en "Run workflow"-knap i Actions-fanen, og
  # knappen har en gren-vælger: enhver gren i repoet kunne sendes i
  # luften med to klik. Uden et push, uden en commit på en
  # udgivelsesgren, og uden at man bagefter kunne se på grenlisten,
  # hvad der faktisk står på siden. Halvfærdigt arbejde ét klik fra
  # at være det, gæsten ser.
  #
  # Nu er der ÉN vej: et push til en af grenene ovenfor. Så er
  # commit'et beviset på, hvad der blev udgivet og hvornår.
  #
  # Skal den samme kode udgives igen uden et nyt commit, gentages
  # den sidste kørsel med "Re-run all jobs" inde på kørslen. Den
  # kører nøjagtig samme commit igen og kan ikke pege på en anden
  # gren – det er forskellen på en gentagelse og en bagdør.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  udgiv:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      # Stempl filerne med et versionsnummer, så telefoner og
      # browsere aldrig kan blande gammel og ny kode sammen efter
      # en opdatering.
      #
      # HER STOD FIRE FILNAVNE. Det var rigtigt, da siden havde
      # fire sider. Siden er der kommet ti til — bestil/, bord/,
      # selskaber/, catering/, baglokale/, arrangementer/,
      # nyheder/ — og INGEN af dem blev stemplet. De blev udgivet
      # med et literalt "?v=__V__" i hvert script-tag.
      #
      # Det virker: browseren henter filen. Men adressen er den
      # samme ved hver udgivelse, så en gæst der har været på
      # siden før, bliver ved med at køre den gamle js/store.js,
      # indtil hun selv tømmer cachen. Præcis det, stemplingen
      # findes for at forhindre — og det ville have ramt på den
      # NÆSTE rettelse, ikke på denne, så ingen ville koble de to
      # ting sammen.
      #
      # find i stedet for en liste: en ny side skal ikke kunne
      # blive glemt her. Det er den samme fejl, listen lige har
      # begået.
      - name: Versionsstempl filerne
        run: |
          V="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './node_modules/*' \
                 -not -path './test-results/*' -not -path './assets/*' -print0 \
            | xargs -0 -r grep -l '__V__' \
            | while read -r f; do
                sed -i "s/__V__/${V}/g" "$f" && echo "stemplet $f"
              done
          exit 0

      # HER STOD enablement: true. Flaget slår GitHub Pages TIL på
      # repoet, hvis det ikke er slået til i forvejen — udgivelsen
      # ændrer altså en indstilling PÅ REPOET som en bivirkning af
      # at køre.
      #
      # Pages er slået til; siden har været i luften siden august.
      # Det eneste, flaget kan nå at gøre herfra, er at tænde igen
      # for noget, nogen med vilje har slukket — og gøre det stille,
      # midt i en udgivelse.
      #
      # Uden det fejler kørslen med en tydelig besked i stedet, og
      # dét er det rigtige svar: er Pages slukket, er der nogen, der
      # har slukket det, og så skal et menneske tage stilling.
      - name: Klargør Pages
        uses: actions/configure-pages@v5

      - name: Pak siden
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Udgiv
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHubs kø kan være langsom i perioder – vent op til 20 min.
          timeout: 1200000
